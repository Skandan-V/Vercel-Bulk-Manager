      .spinner {
        position: relative;
        width: 50px;
        height: 50px;
        border-radius: 50%;
      }
      
      .spinner::before,
      .spinner::after {
        content: "";
        position: absolute;
        border-radius: inherit;
      }
      
      .spinner::before {
        width: 100%;
        height: 100%;
        background-image: linear-gradient(0deg, #10b981 0%, #059669 100%);
        animation: spinLoader 0.6s infinite linear;
      }
      
      .spinner::after {
        width: 85%;
        height: 85%;
        background-color: hsl(0 0% 100%);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
      
      @media (prefers-color-scheme: dark) {
        .spinner::after {
          background-color: hsl(224 71.4% 4.1%);
        }
      }
      
      @keyframes spinLoader {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
